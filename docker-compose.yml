x-environment:
  &default-back-environment
  # These environment variables will be used by taiga-back and taiga-async.
  # Database settings
  POSTGRES_DB: "taiga"
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_HOST: "taiga-db"
  # Taiga settings
  TAIGA_SECRET_KEY: "${SECRET_KEY}"
  TAIGA_SITES_SCHEME: "${TAIGA_SCHEME}"
  TAIGA_SITES_DOMAIN: "${TAIGA_DOMAIN}"
  TAIGA_SUBPATH: "${SUBPATH}"
  # Email settings.
  EMAIL_BACKEND: "django.core.mail.backends.${EMAIL_BACKEND}.EmailBackend"
  DEFAULT_FROM_EMAIL: "${EMAIL_DEFAULT_FROM}"
  EMAIL_USE_TLS: "${EMAIL_USE_TLS}"
  EMAIL_USE_SSL: "${EMAIL_USE_SSL}"
  EMAIL_HOST: "${EMAIL_HOST}"
  EMAIL_PORT: "${EMAIL_PORT}"
  EMAIL_HOST_USER: "${EMAIL_HOST_USER}"
  EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD}"
  # Rabbitmq settings
  RABBITMQ_USER: "${RABBITMQ_USER}"
  RABBITMQ_PASS: "${RABBITMQ_PASS}"
  # Telemetry settings
  ENABLE_TELEMETRY: "${ENABLE_TELEMETRY}"
  # ...your customizations go here

x-volumes:
  &default-back-volumes
  # These volumens will be used by taiga-back and taiga-async.
  - type: volume
    source: taiga
    target: /taiga-back/static
    volume:
      subpath: static-data
  - type: volume
    source: taiga
    target: /taiga-back/media
    volume:
      subpath: media-data
  # - ./config.py:/taiga-back/settings/config.py

services:
  _pre_init-taiga:
    image: taigaio/taiga-back:latest
    entrypoint: ""
    volumes:
      - taiga:/taiga
    working_dir: /taiga
    command:
      - /bin/bash
      - -ec
      - |
        cp -a /taiga-back/static static-data
        cp -a /taiga-back/media media-data
        mkdir -p db-data async-rabbitmq-data events-rabbitmq-data

  taiga-db:
    image: postgres:12.3
    environment:
      POSTGRES_DB: "taiga"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 5s
    volumes:
      - type: volume
        source: taiga
        target: /var/lib/postgresql/data
        volume:
          subpath: db-data
    depends_on:
      _pre_init-taiga:
        condition: service_completed_successfully
    restart: on-failure

  taiga-back:
    build:
      dockerfile_inline: |
        FROM taigaio/taiga-back:latest
        RUN apt update && apt install -y curl
    environment: *default-back-environment
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 5s
    volumes: *default-back-volumes
    depends_on:
      _pre_init-taiga:
        condition: service_completed_successfully
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_started
      taiga-async-rabbitmq:
        condition: service_started
    restart: on-failure

  taiga-async:
    image: taigaio/taiga-back:latest
    entrypoint: ["/taiga-back/docker/async_entrypoint.sh"]
    environment: *default-back-environment
    volumes: *default-back-volumes
    depends_on:
      _pre_init-taiga:
        condition: service_completed_successfully
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_started
      taiga-async-rabbitmq:
        condition: service_started
    restart: on-failure

  taiga-async-rabbitmq:
    image: rabbitmq:3.8-management-alpine
    environment:
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE}"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST}"
    hostname: "taiga-async-rabbitmq"
    volumes:
      - type: volume
        source: taiga
        target: /var/lib/rabbitmq
        volume:
          subpath: async-rabbitmq-data
    depends_on:
      _pre_init-taiga:
        condition: service_completed_successfully
    restart: on-failure

  taiga-front:
    image: taigaio/taiga-front:latest
    environment:
      TAIGA_URL: "${TAIGA_SCHEME}://${TAIGA_DOMAIN}"
      TAIGA_WEBSOCKETS_URL: "${WEBSOCKETS_SCHEME}://${TAIGA_DOMAIN}"
      TAIGA_SUBPATH: "${SUBPATH}"
      # ...your customizations go here
    # volumes:
    #   - ./conf.json:/usr/share/nginx/html/conf.json
    restart: on-failure

  taiga-events:
    image: taigaio/taiga-events:latest
    environment:
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASS: "${RABBITMQ_PASS}"
      TAIGA_SECRET_KEY: "${SECRET_KEY}"
    depends_on:
      taiga-events-rabbitmq:
        condition: service_started
    restart: on-failure

  taiga-events-rabbitmq:
    image: rabbitmq:3.8-management-alpine
    environment:
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE}"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST}"
    hostname: "taiga-events-rabbitmq"
    volumes:
      - type: volume
        source: taiga
        target: /var/lib/rabbitmq
        volume:
          subpath: events-rabbitmq-data
    depends_on:
      _pre_init-taiga:
        condition: service_completed_successfully
    restart: on-failure

  taiga-protected:
    image: taigaio/taiga-protected:latest
    environment:
      MAX_AGE: "${ATTACHMENTS_MAX_AGE}"
      SECRET_KEY: "${SECRET_KEY}"
    restart: on-failure

  taiga:
    image: nginx:1.19-alpine
    volumes:
      - ./taiga-gateway/taiga.conf:/etc/nginx/conf.d/default.conf
      - type: volume
        source: taiga
        target: /taiga/static
        volume:
          subpath: static-data
      - type: volume
        source: taiga
        target: /taiga/media
        volume:
          subpath: media-data
    depends_on:
      taiga-front:
        condition: service_started
      taiga-back:
        condition: service_healthy
      taiga-events:
        condition: service_started
    restart: on-failure

  _post_init-taiga:
    image: taigaio/taiga-back:latest
    environment:
      <<: *default-back-environment
      DJANGO_SUPERUSER_PASSWORD: ChangeMeRightNow
    entrypoint: ""
    volumes: *default-back-volumes
    command: python manage.py createsuperuser --username=super --email=please@fix.me --noinput
    depends_on:
      taiga-back:
        condition: service_healthy

volumes:
  taiga:
    external: true
